name: CI

# Validates, builds, and tests the application on every push and pull request.
#
# CI follows AGENTS.md: Composer validation, `npm run build`, and
# `php artisan test --compact` on PHP 8.4 + Node 22 + SQLite (in-memory).
#
# CATATAN DEPLOY: tidak ada job deploy di sini.
# Produksi berjalan di shared hosting DewaBiz (panel DirectAdmin Evo,
# posukmkewirausahaan.web.id) TANPA SSH/terminal, jadi deploy dilakukan manual
# lewat package: `scripts/deploy-build.sh` -> upload panel/FTP -> artisan via cron.
# Lihat docs/production-deployment.md.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate, build & test (PHP 8.4 / Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo, pdo_sqlite, sqlite3, xml, zip

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate composer.json / composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: PUPPETEER_SKIP_DOWNLOAD=true npm run build

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite (SQLite in-memory)
        run: php artisan test --compact
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
