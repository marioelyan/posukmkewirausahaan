<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<defs>
<!-- Background Gradient -->
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#2563EB"/>
<stop offset="100%" stop-color="#1D4ED8"/>
</linearGradient>
<!-- Screen Gradient -->
<linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#F1F5F9"/>
</linearGradient>
<!-- Accent Gradient -->
<linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#10B981"/>
<stop offset="100%" stop-color="#059669"/>
</linearGradient>
<!-- Soft Drop Shadow -->
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
</filter>
<filter id="receiptShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
</filter>
</defs>
<!-- App Icon Base Background -->
<rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
<!-- Main POS Device Body -->
<g filter="url(#shadow)">
<!-- Base / Stand -->
<path d="M 180 380 L 332 380 L 348 412 L 164 412 Z" fill="#94A3B8"/>
<rect x="140" y="412" width="232" height="12" rx="6" fill="#64748B"/>
<!-- Terminal Frame -->
<rect x="116" y="140" width="280" height="230" rx="20" fill="#1E293B"/>
<!-- Screen Glass -->
<rect x="132" y="156" width="248" height="198" rx="12" fill="url(#screenGrad)"/>
</g>
<!-- Receipt / Struk Emerging from Top -->
<g filter="url(#receiptShadow)">
<path d="M 206 156 L 206 90 L 221 100 L 236 90 L 251 100 L 266 90 L 281 100 L 296 90 L 306 90 L 306 156 Z" fill="#FFFFFF"/>
<!-- Receipt Lines -->
<line x1="222" y1="112" x2="290" y2="112" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
<line x1="222" y1="124" x2="270" y2="124" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
<line x1="222" y1="136" x2="282" y2="136" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- Screen Content Elements -->
<!-- Header Bar inside screen -->
<rect x="148" y="172" width="216" height="24" rx="6" fill="#E2E8F0"/>
<circle cx="164" cy="184" r="5" fill="#3B82F6"/>
<!-- Shopping Items / List Simulators -->
<rect x="148" y="210" width="130" height="12" rx="4" fill="#CBD5E1"/>
<rect x="298" y="210" width="66" height="12" rx="4" fill="#94A3B8"/>
<rect x="148" y="232" width="110" height="12" rx="4" fill="#CBD5E1"/>
<rect x="298" y="232" width="66" height="12" rx="4" fill="#94A3B8"/>
<!-- Divider Line -->
<line x1="148" y1="260" x2="364" y2="260" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4"/>
<!-- Total Amount Display -->
<text x="148" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#64748B">TOTAL</text>
<text x="364" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#0F172A" text-anchor="end">Rp 150K</text>
<!-- Action / Pay Button -->
<rect x="148" y="306" width="216" height="34" rx="8" fill="url(#accentGrad)"/>
<text x="256" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BAYAR</text>
</svg>